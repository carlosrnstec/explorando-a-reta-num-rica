<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorador da Reta Numérica e Números Inteiros</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- QRCode.js Library para geração local de QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      user-select: none;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .number-line-container {
      touch-action: none;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // Lista fixa dos 5 subtemas para garantir cobertura 100% no Desafio
    const SUBTHEMES = [
      { id: 'locate', name: '1. Localizar Número', icon: '📍' },
      { id: 'fractions', name: '2. Frações na Reta', icon: '🍰' },
      { id: 'identify', name: '3. Identificar Ponto', icon: '❓' },
      { id: 'operations', name: '4. Operações e Movimentos', icon: '➕' },
      { id: 'distance', name: '5. Distância e Módulo', icon: '📏' }
    ];

    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateQuestion(mode, difficulty) {
      let q = {
        mode,
        difficulty,
        title: '',
        step: 1,
        startVal: 0,
        totalTicks: 11,
        targetVal: 0,
        initialUserVal: 0,
        hints: [],
        solutionExplanation: '',
        options: [],
        type: 'drag',
        isFraction: false,
        num: 1,
        den: 2
      };

      if (mode === 'locate') {
        let stepOptions = difficulty === 'easy' ? [1, 2, 5] : difficulty === 'medium' ? [3, 4, 6, 10] : [7, 8, 12, 15];
        let step = stepOptions[getRandomInt(0, stepOptions.length - 1)];
        let startTickIndex = getRandomInt(0, 3);
        let startVal = startTickIndex * step;
        
        let targetIndex = getRandomInt(2, 10);
        let targetVal = startVal + (targetIndex * step);

        if (difficulty !== 'easy' && Math.random() > 0.4) {
          let centerIndex = getRandomInt(4, 6);
          startVal = -centerIndex * step;
          targetIndex = getRandomInt(1, 10);
          targetVal = startVal + (targetIndex * step);
        }

        q.step = step;
        q.startVal = startVal;
        q.targetVal = targetVal;
        q.initialUserVal = startVal;
        q.title = `Onde está o número ${targetVal} na reta numérica?`;
        q.type = 'drag';

        q.hints = [
          `Observe os dois primeiros números marcados na reta para descobrir a variação de cada espaço.`,
          `Subtraia os valores dos traços para saber a escala: o valor aumenta de ${step} em ${step}.`,
          `Para chegar em ${targetVal}, comece no ${startVal} e conte de ${step} em ${step}.`
        ];

        q.solutionExplanation = `
          1. O intervalo entre cada marcação na reta é de <strong>${step}</strong> unidades.<br/>
          2. A reta começa em <strong>${startVal}</strong>.<br/>
          3. O número <strong>${targetVal}</strong> está localizado a <strong>${(targetVal - startVal) / step}</strong> divisões à direita de ${startVal}.
        `;

      } else if (mode === 'fractions') {
        let denominators = difficulty === 'easy' ? [2, 3, 4] : difficulty === 'medium' ? [3, 4, 5, 6] : [5, 6, 8, 10];
        let den = denominators[getRandomInt(0, denominators.length - 1)];
        
        let maxUnits = 2;
        let num = getRandomInt(1, maxUnits * den - 1);
        
        if (num % den === 0) {
          num = num + 1 <= maxUnits * den - 1 ? num + 1 : num - 1;
        }

        let targetVal = num / den;
        let step = 1 / den;
        let totalTicks = (maxUnits * den) + 1;

        q.isFraction = true;
        q.den = den;
        q.num = num;
        q.step = step;
        q.startVal = 0;
        q.totalTicks = totalTicks;
        q.targetVal = targetVal;
        q.initialUserVal = 0;
        q.title = `Onde está a fração ${num}/${den} na reta numérica?`;
        q.type = 'drag';

        q.hints = [
          `Observe que cada inteiro (entre 0 e 1, 1 e 2) está dividido em exatamente ${den} partes iguais.`,
          `Cada divisão menor vale 1/${den}.`,
          `Para encontrar ${num}/${den}, parta do zero e avance ${num} divisões de tamanho 1/${den}.`
        ];

        q.solutionExplanation = `
          1. O espaço entre cada número inteiro está dividido em <strong>${den} partes iguais</strong>.<br/>
          2. Portanto, cada traço menor representa a fração <strong>1/${den}</strong>.<br/>
          3. Contando <strong>${num} marcações</strong> a partir do 0, chegamos exatamente na fração <strong>${num}/${den}</strong>.
        `;

      } else if (mode === 'identify') {
        let stepOptions = difficulty === 'easy' ? [1, 2, 5] : [3, 4, 6, 8, 10];
        let step = stepOptions[getRandomInt(0, stepOptions.length - 1)];
        
        let startVal = 0;
        if (difficulty !== 'easy') {
          startVal = getRandomInt(-5, 2) * step;
        }

        let targetIndex = getRandomInt(2, 9);
        let targetVal = startVal + (targetIndex * step);

        q.step = step;
        q.startVal = startVal;
        q.targetVal = targetVal;
        q.pointIndex = targetIndex;
        q.title = `Qual é o número indicado pelo ponto no marcador destacado na reta?`;
        q.type = 'choice';

        let choices = new Set([targetVal]);
        while (choices.size < 4) {
          let offset = getRandomInt(-3, 3) * step;
          if (offset !== 0) choices.add(targetVal + offset);
        }
        q.options = Array.from(choices).sort((a, b) => a - b);

        q.hints = [
          `Calcule a diferença entre duas marcas conhecidas para achar a escala da reta.`,
          `Cada risco representa um avanço de ${step} unidades.`,
          `Conte a partir do ${startVal} avançando ${targetIndex} riscos de tamanho ${step}.`
        ];

        q.solutionExplanation = `
          O ponto está na marcação de número <strong>${targetVal}</strong> porque cada intervalo vale <strong>${step}</strong> e ele está ${targetIndex} passos após o ${startVal}.
        `;

      } else if (mode === 'operations') {
        let a = getRandomInt(-8, 8);
        let b = getRandomInt(-8, 8);
        if (b === 0) b = 3;
        
        let result = a + b;
        let step = 1;
        let minVal = Math.min(a, result, -5) - 2;
        let startVal = minVal;

        q.step = step;
        q.startVal = startVal;
        q.targetVal = result;
        q.opA = a;
        q.opB = b;
        q.initialUserVal = startVal;
        
        let directionText = b > 0 ? `desloque-se ${b} unidades para a DIREITA` : `desloque-se ${Math.abs(b)} unidades para a ESQUERDA`;
        q.title = `Comece no número ${a} e ${directionText}. Em qual número você vai parar?`;
        q.type = 'drag';

        q.hints = [
          `Localize primeiro o número inicial (${a}) na reta.`,
          b > 0 ? `Movimentar para a DIREITA significa SOMAR (+${b}).` : `Movimentar para a ESQUERDA significa SUBTRAIR (${b}).`,
          `A expressão é: (${a}) + (${b}) = ${result}.`
        ];

        q.solutionExplanation = `
          Iniciando em <strong>${a}</strong> e andando <strong>${Math.abs(b)}</strong> posição(ões) para a ${b > 0 ? 'direita (+)' : 'esquerda (-)'}, chegamos exatamente no número <strong>${result}</strong>.
        `;

      } else if (mode === 'distance') {
        let num1 = getRandomInt(-10, 5);
        let num2 = getRandomInt(num1 + 2, num1 + 12);
        let distance = num2 - num1;

        q.step = 1;
        q.startVal = Math.min(num1, -2) - 1;
        q.num1 = num1;
        q.num2 = num2;
        q.targetVal = distance;
        q.title = `Qual é a distância (em unidades) entre o número ${num1} e o número ${num2} na reta numérica?`;
        q.type = 'choice';

        let choices = new Set([distance]);
        while (choices.size < 4) {
          let dummy = distance + getRandomInt(-4, 4);
          if (dummy >= 0 && dummy !== distance) choices.add(dummy);
        }
        q.options = Array.from(choices).sort((a, b) => a - b);

        q.hints = [
          `A distância na reta numérica é sempre um valor positivo (ou zero).`,
          `Você pode contar quantos "espaços" existem entre ${num1} e ${num2}.`,
          `Fórmula da distância: |${num2} - (${num1})| = ${num2} - (${num1}) = ${distance}.`
        ];

        q.solutionExplanation = `
          A distância entre <strong>${num1}</strong> e <strong>${num2}</strong> é de <strong>${distance} unidades</strong> na reta numérica.<br/>
          Cálculo: <code>|${num2} - (${num1})| = ${distance}</code>.
        `;
      }

      return q;
    }

    function NumberLineVisualizer({ 
      question, 
      userVal, 
      onValChange, 
      showSolution = false, 
      interactive = true,
      showSandboxTooltip = false
    }) {
      const svgRef = useRef(null);
      const [isDragging, setIsDragging] = useState(false);

      const totalTicks = question.totalTicks || 11;
      const step = question.step || 1;
      const startVal = question.startVal || 0;
      const endVal = startVal + (totalTicks - 1) * step;

      const ticks = useMemo(() => {
        let arr = [];
        for (let i = 0; i < totalTicks; i++) {
          let val = startVal + i * step;
          val = Math.round(val * 1000) / 1000;
          arr.push({
            index: i,
            val: val
          });
        }
        return arr;
      }, [startVal, step, totalTicks]);

      const getXPercent = (val) => {
        const minPx = 8;
        const maxPx = 92;
        const range = endVal - startVal;
        if (range === 0) return 50;
        const ratio = (val - startVal) / range;
        return minPx + ratio * (maxPx - minPx);
      };

      const handlePointerMove = (e) => {
        if (!interactive || (!isDragging && e.type !== 'pointerdown')) return;
        
        const svg = svgRef.current;
        if (!svg) return;

        const rect = svg.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        if (clientX === undefined) return;

        const clickXRel = (clientX - rect.left) / rect.width;
        
        const minP = 0.08;
        const maxP = 0.92;
        const clampedP = Math.max(minP, Math.min(maxP, clickXRel));
        const normalized = (clampedP - minP) / (maxP - minP);
        const approxValue = startVal + normalized * (endVal - startVal);

        let closestTick = ticks[0].val;
        let minDiff = Math.abs(approxValue - ticks[0].val);

        for (let t of ticks) {
          let diff = Math.abs(approxValue - t.val);
          if (diff < minDiff) {
            minDiff = diff;
            closestTick = t.val;
          }
        }

        onValChange(closestTick);
      };

      const handlePointerDown = (e) => {
        if (!interactive) return;
        setIsDragging(true);
        e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId);
        handlePointerMove(e);
      };

      const handlePointerUp = () => {
        setIsDragging(false);
      };

      return (
        <div class="w-full bg-white p-6 rounded-2xl shadow-sm border border-slate-200 my-4 select-none">
          <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 flex justify-between items-center">
            <span>
              {question.isFraction 
                ? `Divisão da Unidade: ${question.den} partes iguais (1 traço = 1/${question.den})`
                : `Reta Numérica Escala: 1 traço = ${step} ${step === 1 ? 'unidade' : 'unidades'}`}
            </span>
            {interactive && <span class="text-indigo-600 font-medium">Arraste o ponto laranja para responder</span>}
          </div>

          <div class="relative w-full py-8 overflow-x-auto">
            <svg 
              ref={svgRef}
              class="w-full h-32 cursor-pointer touch-none"
              viewBox="0 0 1000 160"
              preserveAspectRatio="xMidYMid meet"
              onPointerDown={handlePointerDown}
              onPointerMove={handlePointerMove}
              onPointerUp={handlePointerUp}
            >
              <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                  <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
                </marker>
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.15" />
                </filter>
              </defs>

              {/* Base Line */}
              <line 
                x1="40" y1="80" 
                x2="960" y2="80" 
                stroke="#334155" 
                strokeWidth="4" 
                strokeLinecap="round"
                markerStart="url(#arrow)"
                markerEnd="url(#arrow)"
              />

              {/* Zero Highlight Marker */}
              {ticks.some(t => Math.abs(t.val) < 0.0001) && (
                <line 
                  x1={40 + (getXPercent(0)/100) * 920} y1="58" 
                  x2={40 + (getXPercent(0)/100) * 920} y2="102" 
                  stroke="#94a3b8" 
                  strokeWidth="3" 
                  strokeDasharray="3 3"
                />
              )}

              {/* Ticks and Labels */}
              {ticks.map((t, idx) => {
                const xPct = getXPercent(t.val);
                const xPx = (xPct / 100) * 1000;
                
                let showLabel = true;
                let isMajorTick = true;

                if (question.isFraction) {
                  const isInteger = Math.abs(t.val - Math.round(t.val)) < 0.0001;
                  isMajorTick = isInteger;
                  
                  if (question.mode === 'fractions') {
                    showLabel = isInteger;
                  }
                } else if (question.mode === 'locate') {
                  showLabel = (idx === 0 || idx === 1);
                } else if (question.mode === 'identify') {
                  showLabel = (idx !== question.pointIndex && (idx === 0 || idx === 1 || idx === ticks.length - 1));
                } else if (question.mode === 'operations') {
                  showLabel = (t.val === question.opA || idx === 0 || idx === ticks.length - 1);
                } else if (question.mode === 'distance') {
                  showLabel = (t.val === question.num1 || t.val === question.num2 || t.val === 0);
                }

                if (showSolution) showLabel = true;

                const isZero = Math.abs(t.val) < 0.0001;

                return (
                  <g key={idx}>
                    <line 
                      x1={xPx} y1={isMajorTick ? "66" : "72"} 
                      x2={xPx} y2={isMajorTick ? "94" : "88"} 
                      stroke={isZero ? "#0f172a" : isMajorTick ? "#334155" : "#64748b"} 
                      strokeWidth={isZero ? "4" : isMajorTick ? "3" : "2"} 
                      strokeLinecap="round"
                    />

                    {showLabel && (
                      <text 
                        x={xPx} 
                        y="125" 
                        textAnchor="middle" 
                        fontSize={isMajorTick ? "22" : "16"} 
                        fontWeight={isZero ? "800" : isMajorTick ? "700" : "500"} 
                        fill={isZero ? "#2563eb" : "#1e293b"}
                      >
                        {question.isFraction && !isMajorTick 
                          ? `${Math.round(t.val * question.den)}/${question.den}`
                          : Math.round(t.val * 100) / 100}
                      </text>
                    )}

                    {question.mode === 'identify' && idx === question.pointIndex && !showSolution && (
                      <g transform={`translate(${xPx}, 40)`}>
                        <circle r="16" fill="#e11d48" />
                        <text y="6" textAnchor="middle" fill="white" fontSize="18" fontWeight="bold">?</text>
                      </g>
                    )}
                  </g>
                );
              })}

              {/* Distance Highlight Arc */}
              {question.mode === 'distance' && (
                <g>
                  {(() => {
                    const x1 = (getXPercent(question.num1) / 100) * 1000;
                    const x2 = (getXPercent(question.num2) / 100) * 1000;
                    const midX = (x1 + x2) / 2;
                    return (
                      <>
                        <path 
                          d={`M ${x1} 70 Q ${midX} 20 ${x2} 70`} 
                          fill="none" 
                          stroke="#8b5cf6" 
                          strokeWidth="3" 
                          strokeDasharray="6 4"
                        />
                        <rect x={midX - 35} y="15" width="70" height="26" rx="6" fill="#8b5cf6" />
                        <text x={midX} y="33" textAnchor="middle" fill="white" fontSize="14" fontWeight="bold">
                          distância
                        </text>
                      </>
                    );
                  })()}
                </g>
              )}

              {/* User Interactive Orange Draggable Point */}
              {(question.type === 'drag' || userVal !== undefined) && (
                <g 
                  transform={`translate(${(getXPercent(userVal) / 100) * 1000}, 80)`}
                  style={{ cursor: interactive ? 'grab' : 'default', transition: isDragging ? 'none' : 'transform 0.15s ease-out' }}
                  filter="url(#shadow)"
                >
                  <circle r="20" fill="#f97316" fillOpacity="0.25" class="animate-pulse" />
                  <circle r="12" fill="#f97316" stroke="#ffffff" strokeWidth="3" />
                  <circle r="4" fill="#ffffff" />
                  
                  {showSandboxTooltip && (
                    <g transform="translate(0, -28)">
                      <rect x="-24" y="-18" width="48" height="24" rx="6" fill="#0f172a" />
                      <text x="0" y="-2" textAnchor="middle" fill="#ffffff" fontSize="13" fontWeight="bold">
                        {userVal}
                      </text>
                    </g>
                  )}
                </g>
              )}

              {/* Show Target Correct Answer marker when solved/failed */}
              {showSolution && Math.abs(question.targetVal - userVal) > 0.001 && (
                <g transform={`translate(${(getXPercent(question.targetVal) / 100) * 1000}, 80)`}>
                  <circle r="12" fill="#22c55e" stroke="#ffffff" strokeWidth="3" />
                  <text y="-20" textAnchor="middle" fill="#15803d" fontSize="14" fontWeight="bold">
                    Resposta Correta: {question.isFraction ? `${question.num}/${question.den}` : question.targetVal}
                  </text>
                </g>
              )}
            </svg>
          </div>

          <div class="flex justify-between items-center text-xs text-slate-500 pt-2 border-t border-slate-100">
            <span>Dica: Clique ou arraste o marcador de valor na reta</span>
            <span class="font-medium text-slate-400">Ponto posicionado na reta</span>
          </div>
        </div>
      );
    }

    function QuizPractice({ mode, difficulty, onScoreUpdate }) {
      const [question, setQuestion] = useState(null);
      const [userVal, setUserVal] = useState(0);
      const [selectedChoice, setSelectedChoice] = useState(null);
      const [hintLevel, setHintLevel] = useState(0);
      const [submitted, setSubmitted] = useState(false);
      const [isCorrect, setIsCorrect] = useState(false);
      const [showExplanation, setShowExplanation] = useState(false);

      useEffect(() => {
        loadNewQuestion();
      }, [mode, difficulty]);

      const loadNewQuestion = () => {
        const q = generateQuestion(mode, difficulty);
        setQuestion(q);
        setUserVal(q.initialUserVal || q.startVal);
        setSelectedChoice(null);
        setHintLevel(0);
        setSubmitted(false);
        setIsCorrect(false);
        setShowExplanation(false);
      };

      const handleCheck = () => {
        if (!question || submitted) return;

        let correct = false;
        if (question.type === 'drag') {
          correct = Math.abs(userVal - question.targetVal) < 0.001;
        } else if (question.type === 'choice') {
          correct = (selectedChoice === question.targetVal);
        }

        setSubmitted(true);
        setIsCorrect(correct);

        if (correct) {
          const pts = difficulty === 'easy' ? 10 : difficulty === 'medium' ? 15 : 20;
          onScoreUpdate(pts);
          try {
            confetti({
              particleCount: 80,
              spread: 70,
              origin: { y: 0.6 }
            });
          } catch(e) {}
        }
      };

      if (!question) return null;

      const currentSubthemeInfo = SUBTHEMES.find(s => s.id === mode) || SUBTHEMES[0];

      return (
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 max-w-7xl mx-auto">
          {/* Main Question Display Area */}
          <div class="lg:col-span-2 space-y-4">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
              <div class="flex justify-between items-center mb-4">
                <span class="px-3 py-1 bg-indigo-50 text-indigo-700 font-extrabold text-xs rounded-lg uppercase tracking-wider">
                  {currentSubthemeInfo.icon} {currentSubthemeInfo.name}
                </span>
                <span class="text-xs font-bold text-slate-400">
                  Nível: <strong class="text-slate-700 capitalize">{difficulty}</strong>
                </span>
              </div>

              <h2 class="text-xl sm:text-2xl font-black text-slate-800 mb-4">{question.title}</h2>

              <NumberLineVisualizer 
                question={question}
                userVal={userVal}
                onValChange={setUserVal}
                showSolution={submitted && showExplanation}
                interactive={question.type === 'drag' && !submitted}
                showSandboxTooltip={false}
              />

              {/* Multiple Choice Options */}
              {question.type === 'choice' && (
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-4">
                  {question.options.map((opt) => (
                    <button
                      key={opt}
                      disabled={submitted}
                      onClick={() => setSelectedChoice(opt)}
                      class={`p-4 rounded-xl font-bold text-lg transition border ${
                        selectedChoice === opt 
                          ? 'bg-indigo-600 text-white border-indigo-600 shadow-md ring-2 ring-indigo-200' 
                          : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                      }`}
                    >
                      {opt}
                    </button>
                  ))}
                </div>
              )}
            </div>

            {/* Dica */}
            {hintLevel > 0 && (
              <div class="bg-amber-50 border border-amber-200 p-5 rounded-2xl space-y-2">
                <h4 class="font-extrabold text-amber-900 text-sm flex items-center gap-2">
                  <span>💡</span> Dica {hintLevel} de {question.hints.length}:
                </h4>
                <div class="space-y-1">
                  {question.hints.slice(0, hintLevel).map((h, idx) => (
                    <p key={idx} class="text-sm font-medium text-amber-800 bg-amber-100/60 p-2.5 rounded-lg border border-amber-200/50">
                      • {h}
                    </p>
                  ))}
                </div>
              </div>
            )}

            {/* Solução Explicada */}
            {showExplanation && (
              <div class="bg-emerald-50 border border-emerald-200 p-5 rounded-2xl space-y-2">
                <h4 class="font-extrabold text-emerald-900 text-sm flex items-center gap-2">
                  <span>📘</span> Resolução Passo a Passo:

    function TimedChallenge({ onScoreUpdate, webAppUrl, onOpenSheetsModal }) {
      const [phase, setPhase] = useState('setup');
      const [participantType, setParticipantType] = useState('individual');
      const [participantName, setParticipantName] = useState('');
      const [timeLimit, setTimeLimit] = useState(60);
      
      const [timeLeft, setTimeLeft] = useState(60);
      const [currentScore, setCurrentScore] = useState(0);
      const [correctCount, setCorrectCount] = useState(0);
      const [totalAttempted, setTotalAttempted] = useState(0);
      const [streak, setStreak] = useState(0);

      const [currentSubthemeIndex, setCurrentSubthemeIndex] = useState(0);
      const [completedSubthemes, setCompletedSubthemes] = useState([]);

      const [question, setQuestion] = useState(null);
      const [userVal, setUserVal] = useState(0);
      const [selectedChoice, setSelectedChoice] = useState(null);
      const [feedback, setFeedback] = useState(null);
      const [isSendingSheet, setIsSendingSheet] = useState(false);

      const [leaderboard, setLeaderboard] = useState(() => {
        try {
          const saved = localStorage.getItem('reta_numerica_leaderboard');
          return saved ? JSON.parse(saved) : [
            { id: 1, name: 'Equipe Alpha', type: 'group', score: 140, correct: 5, total: 5, date: 'Hoje' },
            { id: 2, name: 'Maria Silva', type: 'individual', score: 110, correct: 5, total: 5, date: 'Hoje' },
            { id: 3, name: 'João Pedro', type: 'individual', score: 80, correct: 4, total: 5, date: 'Hoje' }
          ];
        } catch(e) {
          return [];
        }
      });

      const timerRef = useRef(null);

      useEffect(() => {
        try {
          localStorage.setItem('reta_numerica_leaderboard', JSON.stringify(leaderboard));
        } catch(e) {}
      }, [leaderboard]);

      const loadQuestionForIndex = (index) => {
        const subtheme = SUBTHEMES[index % SUBTHEMES.length];
        const diff = 'medium';
        const q = generateQuestion(subtheme.id, diff);
        setQuestion(q);
        setUserVal(q.initialUserVal || q.startVal);
        setSelectedChoice(null);
        setFeedback(null);
      };

      const startChallenge = () => {
        if (!participantName.trim()) {
          alert('Por favor, informe seu nome ou o nome do grupo!');
          return;
        }
        setPhase('playing');
        setCurrentScore(0);
        setCorrectCount(0);
        setTotalAttempted(0);
        setStreak(0);
        setTimeLeft(timeLimit);
        setCurrentSubthemeIndex(0);
        setCompletedSubthemes([]);
        
        loadQuestionForIndex(0);

        if (timerRef.current) clearInterval(timerRef.current);
        timerRef.current = setInterval(() => {
          setTimeLeft((prev) => {
            if (prev <= 1) {
              clearInterval(timerRef.current);
              endChallenge();
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
      };

      const endChallenge = () => {
        if (timerRef.current) clearInterval(timerRef.current);
        setPhase('summary');
        
        try {
          confetti({
            particleCount: 150,
            spread: 90,
            origin: { y: 0.5 }
          });
        } catch(e) {}
      };

      // Salvar na Planilha do Google Sheets ao terminar a rodada
      const saveToGoogleSheets = async (entry) => {
        if (!webAppUrl) return;
        setIsSendingSheet(true);
        try {
          const payload = JSON.stringify({
            timestamp: new Date().toLocaleString('pt-BR'),
            name: entry.name,
            type: entry.type === 'group' ? 'Grupo' : 'Individual',
            score: entry.score,
            correct: entry.correct,
            total: entry.total,
            accuracy: entry.total > 0 ? Math.round((entry.correct / entry.total) * 100) : 0
          });

          await fetch(webAppUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
              'Content-Type': 'text/plain;charset=utf-8'
            },
            body: payload
          });
        } catch (e) {
          console.error("Erro ao enviar para o Google Sheets:", e);
        } finally {
          setIsSendingSheet(false);
        }
      };

      useEffect(() => {
        if (phase === 'summary') {
          const newEntry = {
            id: Date.now(),
            name: participantName,
            type: participantType,
            score: currentScore,
            correct: correctCount,
            total: totalAttempted,
            date: new Date().toLocaleDateString('pt-BR', { hour: '2-digit', minute: '2-digit' })
          };

          setLeaderboard(prev => {
            const updated = [...prev, newEntry].sort((a, b) => b.score - a.score);
            return updated;
          });

          if (webAppUrl) {
            saveToGoogleSheets(newEntry);
          }
        }
      }, [phase]);

      const handleAnswer = () => {
        if (feedback !== null || !question) return;
        
        let isCorrect = false;
        if (question.type === 'drag') {
          isCorrect = Math.abs(userVal - question.targetVal) < 0.001;
        } else if (question.type === 'choice') {
          isCorrect = (selectedChoice === question.targetVal);
        }

        const currentSubtheme = SUBTHEMES[currentSubthemeIndex % SUBTHEMES.length];

          setCurrentScore(prev => prev + addedPoints);
          setCorrectCount(prev => prev + 1);

          {activeTab === 'practice' && (
            <div class="bg-white border-b border-slate-200 py-2">
              <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center gap-3 text-xs font-bold">
                <span class="text-slate-400 uppercase">Dificuldade:</span>
                <button 
                  onClick={() => setDifficulty('easy')}
                  class={`px-3 py-1 rounded-md transition ${difficulty === 'easy' ? 'bg-emerald-100 text-emerald-800 font-extrabold' : 'text-slate-500 hover:bg-slate-100'}`}
                >
                  Fácil
                </button>
                <button 
                  onClick={() => setDifficulty('medium')}
                  class={`px-3 py-1 rounded-md transition ${difficulty === 'medium' ? 'bg-amber-100 text-amber-800 font-extrabold' : 'text-slate-500 hover:bg-slate-100'}`}
                >
                  Médio
                </button>
                <button 
                  onClick={() => setDifficulty('hard')}
                  class={`px-3 py-1 rounded-md transition ${difficulty === 'hard' ? 'bg-rose-100 text-rose-800 font-extrabold' : 'text-slate-500 hover:bg-slate-100'}`}
                >
                  Desafio
                </button>
              </div>
            </div>
          )}

          <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
            {activeTab === 'practice' ? (
              <QuizPractice 
                mode={practiceMode} 
                difficulty={difficulty} 
                onScoreUpdate={(pts) => setScore(s => s + pts)} 
              />
            ) : activeTab === 'challenge' ? (
              <TimedChallenge 
                onScoreUpdate={(pts) => setScore(s => s + pts)} 
                webAppUrl={webAppUrl}
                onOpenSheetsModal={() => setIsSheetsModalOpen(true)}
              />
            ) : (
              <SandboxExplorer />
            )}
          </main>

          {/* Modais da Aplicação */}
          <GoogleSheetsModal 
            isOpen={isSheetsModalOpen}
            onClose={() => setIsSheetsModalOpen(false)}
            webAppUrl={webAppUrl}
            setWebAppUrl={setWebAppUrl}
          />

          <QRCodeModal 
            isOpen={isQRModalOpen}
            onClose={() => setIsQRModalOpen(false)}
            targetUrl={currentAppUrl}
          />

          <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
            Explorador da Reta Numérica &bull; Recurso Educativo de Matemática Inteira e Fracionária
          </footer>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
